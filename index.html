<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baixador Universal de Vídeos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen p-4">
    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md text-center border border-gray-700">
        
        <div class="mb-8">
            <i class="fa-solid fa-cloud-arrow-down text-5xl text-blue-500 mb-4"></i>
            <h1 class="text-3xl font-bold text-gray-100">Video Downloader</h1>
            <p class="text-gray-400 mt-2 text-sm">Cole o link do vídeo abaixo (YouTube, TikTok, Instagram, etc.)</p>
        </div>
        
        <form action="/baixar" method="POST" class="space-y-5">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fa-solid fa-link text-gray-500"></i>
                </div>
                <input type="url" name="url" placeholder="https://..." required
                    class="w-full pl-10 pr-4 py-3 rounded-xl bg-gray-900 border border-gray-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-gray-200">
            </div>
            
            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-[0_0_15px_rgba(37,99,235,0.3)] hover:shadow-[0_0_25px_rgba(37,99,235,0.5)] flex items-center justify-center">
                <i class="fa-solid fa-bolt mr-2"></i> Extrair Vídeo
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-gray-700 text-xs text-gray-500">
            <p>O download começará automaticamente após a extração.</p>
        </div>
    </div>
</body>
</html>
